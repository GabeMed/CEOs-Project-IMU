[platformio]
default_envs = upesy_wroom

; Firmware: ESP32 (uPesy ESP32 Wroom DevKit), Arduino framework.
[env:upesy_wroom]
platform = espressif32@7.1.3
board = upesy_wroom
framework = arduino
lib_deps = paulstoffregen/Mahony@^1.2
monitor_speed = 115200
build_src_flags = -Wall -Wextra

; Host-side unit tests for include/icm20948.h: pio test -e native
[env:native]
platform = native
test_framework = unity
